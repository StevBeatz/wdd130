<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Co.</title>
    <meta name="description"
      content="Contact White Water Rafting Co. — call, email, or send us a message about reservations, general questions, or website suggestions.">
    <meta name="author" content="Otoo-Yirenkyi Stephen">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg"
          alt="White Water Rafting Co. logo featuring a raft on rushing rapids">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- ===== COMPANY INFORMATION ===== -->
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </p>
        </section>

        <!-- ===== MAP + FORM ===== -->
        <div class="contact-grid">
            <section class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3175.844125805624!2d-113.07240608482646!3d37.25114897985017!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80cae1b1c1b1b1b1%3A0x1b1b1b1b1b1b1b1b!2sZion%20National%20Park!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                  title="Map showing the location of White Water Rafting Company"></iframe>
            </section>

            <section class="contact-form">
                <h2>Send Us a Message</h2>

                <form action="#" method="post">
                    <div class="form-row">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Your name"
                          required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com"
                          required>
                    </div>

                    <fieldset class="form-row">
                        <legend>Message Purpose</legend>

                        <label>
                            <input type="radio" name="purpose" value="general" checked>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <div class="form-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Type here..."
                          required></textarea>
                    </div>

                    <div class="form-row checkbox-row">
                        <label>
                            <input type="checkbox" name="newsletter" value="yes">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </div>

        <!-- ===== EMPLOYEE PROFILES ===== -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/boat 2.jpg"
                      alt="Emma Carter, Lead River Guide, smiling beside a raft">
                    <figcaption>Emma Carter — Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/boat.jpg"
                      alt="Daniel Reyes, Reservations Manager, at the river launch">
                    <figcaption>Daniel Reyes — Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/boat_happy.jpg"
                      alt="Ava Mitchell, Safety Coordinator, reviewing gear on the riverbank">
                    <figcaption>Ava Mitchell — Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting Co. | Otoo-Yirenkyi Stephen</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook icon">
            </a>
            <a href="https://www.linkedin.com" target="_blank" rel="noopener">
                <img src="images/linkedin.svg" alt="LinkedIn icon">
            </a>
            <a href="https://www.instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>
        </nav>
    </footer>
</body>

</html>
